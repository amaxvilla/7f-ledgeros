services:

  postgres:
    image: postgres:16-alpine
    container_name: ledgeros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledgeros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_DB: ${POSTGRES_DB:-ledgeros}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledgeros} -d ${POSTGRES_DB:-ledgeros}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ledgeros-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: ledgeros-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ledgeros}:${POSTGRES_PASSWORD:-change_me_locally}@postgres:5432/${POSTGRES_DB:-ledgeros}?schema=public
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      API_PORT: 4000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: ledgeros-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ledgeros}:${POSTGRES_PASSWORD:-change_me_locally}@postgres:5432/${POSTGRES_DB:-ledgeros}?schema=public
      REDIS_URL: redis://redis:6379
      INTERNAL_API_BASE_URL: http://api:4000/api/v1
      WORKER_HTTP_PORT: 4100
    ports:
      - "${WORKER_HTTP_PORT:-4100}:4100"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4100/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: ledgeros-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      INTERNAL_API_BASE_URL: http://api:4000/api/v1
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    container_name: ledgeros-backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-ledgeros}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      PGDATABASE: ${POSTGRES_DB:-ledgeros}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./storage/backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /backups

        while true; do
          timestamp=$$(date +%Y%m%d_%H%M%S)
          file="/backups/ledgeros_$${timestamp}.sql"

          echo "[$$(date -Iseconds)] Starting PostgreSQL backup..."

          if pg_dump --format=custom --file="$${file}" "$${PGDATABASE}"; then
            echo "[$$(date -Iseconds)] Backup completed: $${file}"
          else
            echo "[$$(date -Iseconds)] Backup FAILED"
            rm -f "$${file}"
          fi

          find /backups -type f -name 'ledgeros_*.sql' -mtime +"$${BACKUP_RETENTION_DAYS}" -delete || true

          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done

volumes:
  pg_data:
  redis_data:
